<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Test</title>
    <style>
        /* Test modal styles */
        #league-details-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: none;
            background: rgba(0,0,0,0.5);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            direction: rtl;
        }

        #league-details-modal.show {
            display: flex !important;
        }

        .league-modal-content {
            width: 90%;
            max-width: 900px;
            height: 80%;
            max-height: 80vh;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.3);
        }

        .league-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #eee;
            background: #f8f9fa;
            flex-shrink: 0;
        }

        .tab-panel {
            display: none;
            height: 100%;
            overflow-y: auto;
            padding: 20px;
        }

        .tab-panel.active {
            display: block;
        }

        .tab-button {
            padding: 10px 15px;
            border: none;
            background: #f8f9fa;
            cursor: pointer;
            margin-right: 5px;
        }

        .tab-button.active {
            background: #248acf;
            color: white;
        }
    </style>
</head>
<body>
    <button onclick="showModal()">Show Modal</button>
    <button onclick="hideModal()">Hide Modal</button>

    <div id="league-details-modal">
        <div class="league-modal-content">
            <div class="league-modal-header">
                <h2>Test Modal</h2>
                <button onclick="hideModal()">&times;</button>
            </div>
            <div class="league-modal-body">
                <div class="league-tabs">
                    <button class="tab-button active" data-tab="overview">نمای کلی</button>
                    <button class="tab-button" data-tab="standings">جدول</button>
                </div>
                <div class="tab-content">
                    <div id="overview-tab" class="tab-panel active">
                        <h3>Overview Content</h3>
                        <p>This is the overview tab content.</p>
                    </div>
                    <div id="standings-tab" class="tab-panel">
                        <h3>Standings Content</h3>
                        <p>This is the standings tab content.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showModal() {
            console.log('Showing modal...');
            const modal = document.getElementById('league-details-modal');
            modal.classList.add('show');
            console.log('Modal classes:', modal.className);
            console.log('Modal display:', getComputedStyle(modal).display);
        }

        function hideModal() {
            console.log('Hiding modal...');
            const modal = document.getElementById('league-details-modal');
            modal.classList.remove('show');
            console.log('Modal classes:', modal.className);
            console.log('Modal display:', getComputedStyle(modal).display);
        }

        // Tab switching
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', function() {
                const tabId = this.dataset.tab;
                console.log('Switching to tab:', tabId);
                
                // Update active tab button
                document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                
                // Update active tab panel
                document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
                document.getElementById(tabId + '-tab').classList.add('active');
            });
        });
    </script>
</body>
</html>
